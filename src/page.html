<title>Igisoro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/*%%CSS%%*/
</style>

<div class="app" id="app">
  <header class="top">
    <a class="brand" href="#home" data-act="nav" data-to="home" aria-label="Igisoro, home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="m0" d="M12 0l12 12-12 12L0 12z"/><path class="m2" d="M12 4.500l7.500 7.500-7.500 7.500L4.500 12z"/><path class="m1" d="M12 8l4 4-4 4-4-4z"/></svg>
      <span>Igisoro</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#play" data-act="nav" data-to="play">Play</a>
      <a href="#learn" data-act="nav" data-to="learn">Learn</a>
      <a href="#puzzles" data-act="nav" data-to="puzzles">Puzzles</a>
      <a href="#progress" data-act="nav" data-to="progress">Progress</a>
    </nav>
    <div class="top-right">
      <a class="chip" id="chip-streak" href="#progress" data-act="nav" data-to="progress" title="Days played in a row" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 5.500 5 11a5 5 0 0 1-10 0c0-2 1-3.500 2-4.500.2 2 1 3 2 3.500C10.500 9 11 5 12 2z"/></svg><b>0</b><span class="sr">day streak</span></a>
      <a class="chip" id="chip-cows" href="#progress" data-act="nav" data-to="progress" title="Your herd"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.500 3.500C2.500 10 6 13 12 13s9.500-3 9.500-9.500c-1 4-4 6.300-6.900 6.500H9.400C6.500 9.800 3.500 7.500 2.500 3.500z"/><path d="M8.600 12.200h6.800l-1.700 7.300c-.7 1.500-2.700 1.500-3.400 0z"/></svg><b>50</b><span class="sr">cows</span></a>
      <button class="icon-btn" id="btn-settings" data-act="settings" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.200" fill="none" stroke="currentColor" stroke-width="1.800"/><path d="M12 2.500v3M12 18.500v3M2.500 12h3M18.500 12h3M5.300 5.300l2.100 2.100M16.600 16.600l2.100 2.100M5.300 18.700l2.100-2.100M16.600 7.400l2.100-2.100" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <div class="zig" aria-hidden="true"></div>

  <main class="layout" id="layout">
    <section class="stage" id="stage" aria-label="Igisoro board">
      <div class="plate" id="plate-top" hidden></div>
      <div class="board" id="board">
        <canvas id="gl" aria-hidden="true"></canvas>
        <svg id="fx" viewBox="0 0 870 702" aria-hidden="true"></svg>
        <div class="pits" id="pits" role="group" aria-label="Pits. Use the arrow keys to move, Enter to preview and confirm, Escape to cancel."></div>
        <div class="veil" id="veil" hidden></div>
        <div class="handchip" id="handchip" hidden></div>
        <div class="prompt" id="prompt" hidden></div>
        <div class="chooser" id="chooser" role="group" aria-label="Choose which way to sow" hidden></div>
      </div>
      <div class="plate" id="plate-bottom" hidden></div>
      <div class="controls" id="controls" hidden></div>
      <div class="stage-note" id="stage-note" hidden></div>
      <p class="say" id="say" role="status" aria-live="polite"></p>
    </section>
    <section class="panel" id="panel" aria-live="off"></section>
  </main>

  <footer class="foot"><b>Igisoro</b><span>by SteshLabs</span><a href="#about" data-act="nav" data-to="about">About Igisoro</a></footer>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog class="dlg" id="dlg" aria-label="Settings"></dialog>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script id="src-engine">
/*%%ENGINE%%*/
</script>
<script id="src-ai">
/*%%AI%%*/
</script>
<script>
/*%%APP%%*/
(function () {
  var hot = window.claude && window.claude.hot;
  function start(data) { window.IG.ui.boot(data || {}); }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start(hot && hot.data);
})();
</script>
